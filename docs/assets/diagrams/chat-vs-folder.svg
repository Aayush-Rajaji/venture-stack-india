<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="800" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cvf-title cvf-desc">
  <title id="cvf-title">A chat window compared with an AI pointed at your folder</title>
  <desc id="cvf-desc">Two columns side by side. The left column, headed "A chat window", is a browser tab with nothing attached to it, and lists four limits: it sees only what you paste, so you re-explain the business every time; it forgets when the chat closes, so yesterday's decisions are gone; it cannot open your files, so the deck and the model stay shut; and it answers in general terms, giving advice that would fit any company. The list stops there because there is nothing else it can reach. The right column, headed "An AI pointed at your folder", is a desktop app or terminal with folder access, and is deliberately longer, listing five things it can do: it reads the files itself, opening the deck, the plan and the call notes; it writes back into them, so corrections land in the file rather than the chat; it cites where each fact came from, writing the source file and page beside the claim; it starts already knowing the business, so there is no re-briefing; and it gets better every time you add something, because every real event goes back into the folder. A strip along the bottom states that the chat answers about startups while the other one answers about yours.</desc>

  <rect x="0" y="0" width="1200" height="800" rx="16" fill="var(--dg-bg, #EEF4F6)"/>

  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-text, #10222C)">A chat window, and an AI pointed at your folder</text>
  <text x="48" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Same model in both columns. The difference is what it can reach.</text>

  <!-- left column -->
  <text x="48" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-muted, #3F5560)">A chat window</text>
  <text x="48" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">A browser tab with nothing attached to it.</text>
  <line x1="48" y1="186" x2="544" y2="186" stroke="var(--dg-border-strong, #75878F)" stroke-width="1.5"/>

  <rect x="48" y="206" width="496" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="90" cy="248" r="15" fill="none" stroke="var(--dg-danger, #C62C49)" stroke-width="1.5"/>
  <path d="M 84,242 L 96,254 M 96,242 L 84,254" stroke="var(--dg-danger, #C62C49)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="128" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Sees only what you paste</text>
  <text x="128" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">You re-explain the business every time.</text>

  <rect x="48" y="304" width="496" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="90" cy="346" r="15" fill="none" stroke="var(--dg-danger, #C62C49)" stroke-width="1.5"/>
  <path d="M 84,340 L 96,352 M 96,340 L 84,352" stroke="var(--dg-danger, #C62C49)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="128" y="342" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Forgets when the chat closes</text>
  <text x="128" y="370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Yesterday's decisions are gone.</text>

  <rect x="48" y="402" width="496" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="90" cy="444" r="15" fill="none" stroke="var(--dg-danger, #C62C49)" stroke-width="1.5"/>
  <path d="M 84,438 L 96,450 M 96,438 L 84,450" stroke="var(--dg-danger, #C62C49)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="128" y="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Cannot open your files</text>
  <text x="128" y="468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">The deck and the model stay shut.</text>

  <rect x="48" y="500" width="496" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="90" cy="542" r="15" fill="none" stroke="var(--dg-danger, #C62C49)" stroke-width="1.5"/>
  <path d="M 84,536 L 96,548 M 96,536 L 84,548" stroke="var(--dg-danger, #C62C49)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="128" y="538" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Answers in general terms</text>
  <text x="128" y="566" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Advice that would fit any company.</text>

  <text x="48" y="624" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">The list stops here — there is nothing<tspan x="48" dy="22">else in your business it can reach.</tspan></text>

  <!-- right column -->
  <text x="592" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-primary, #0B5A86)">An AI pointed at your folder</text>
  <text x="592" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">A desktop app or terminal with folder access.</text>
  <line x1="592" y1="186" x2="1152" y2="186" stroke="var(--dg-border-strong, #75878F)" stroke-width="1.5"/>

  <rect x="592" y="206" width="560" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="634" cy="248" r="15" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="1.5"/>
  <polyline points="627,248 632,254 641,242" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="672" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Reads the files itself</text>
  <text x="672" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Opens the deck, the plan, the call notes.</text>

  <rect x="592" y="304" width="560" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="634" cy="346" r="15" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="1.5"/>
  <polyline points="627,346 632,352 641,340" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="672" y="342" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Writes back into them</text>
  <text x="672" y="370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Corrections land in the file, not the chat.</text>

  <rect x="592" y="402" width="560" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="634" cy="444" r="15" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="1.5"/>
  <polyline points="627,444 632,450 641,438" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="672" y="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Cites where each fact came from</text>
  <text x="672" y="468" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Writes the file and page beside the claim.</text>

  <rect x="592" y="500" width="560" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="634" cy="542" r="15" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="1.5"/>
  <polyline points="627,542 632,548 641,536" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="672" y="538" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Starts already knowing the business</text>
  <text x="672" y="566" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">No re-briefing. No warm-up questions.</text>

  <rect x="592" y="598" width="560" height="84" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="634" cy="640" r="15" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="1.5"/>
  <polyline points="627,640 632,646 641,634" fill="none" stroke="var(--dg-success, #0C7A63)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="672" y="636" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Gets better every time you add</text>
