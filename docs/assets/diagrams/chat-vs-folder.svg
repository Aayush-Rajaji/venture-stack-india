  <text x="600" y="750" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-text, #10222C)">The chat answers about startups. The other one answers about yours.</text>
</svg>
