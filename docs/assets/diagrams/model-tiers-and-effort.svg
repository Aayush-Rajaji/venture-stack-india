  <circle cx="932" cy="954" r="8" fill="var(--dg-secondary, #0C7A63)"/>
  <line x1="64" y1="988" x2="1136" y2="988" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>

