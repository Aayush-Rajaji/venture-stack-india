  <circle cx="652" cy="479" r="8" fill="var(--dg-secondary, #0C7A63)"/>
  <text x="676" y="486" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Keep it low</text>
  <text x="676" y="516" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">A lookup, a rename, a reformat. You can<tspan x="676" dy="24">check the answer at a glance.</tspan></text>

