  <circle cx="82" cy="349" r="15" fill="var(--dg-primary, #0B5A86)"/>
  <text x="82" y="355" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="var(--dg-surface, #FFFFFF)">3</text>
  <text x="112" y="356" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Ambiguous, high stakes</text>
  <text x="112" y="386" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Pricing, positioning, what to tell an<tspan x="112" dy="24">investor. Being wrong here costs you.</tspan></text>

  <!-- rung 2 -->
