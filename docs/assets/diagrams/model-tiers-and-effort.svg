  <text x="112" y="634" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Extraction, renaming, filing, turning a<tspan x="112" dy="24">page of notes into a table.</tspan></text>

  <text x="48" y="706" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">Every provider publishes its own names for these<tspan x="48" dy="22">rungs, and the names change. The ladder does not.</tspan></text>

