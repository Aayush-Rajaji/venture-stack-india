<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1288" width="100%" height="1288" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mte-title mte-desc">
  <title id="mte-title">Tiers and the effort dial: two separate controls</title>
  <desc id="mte-desc">Two controls are drawn side by side, because they are independent of each other and are commonly treated as one. On the left is a ladder of four rungs, each labelled by what it is for rather than by what it is called. Rung one, the fastest and lightest, is routine reformatting: extraction, renaming, filing, turning a page of notes into a table. Rung two is everyday drafting and research from material you already have, and most of the work sits there. Rung three is ambiguous, high-stakes analysis such as pricing, positioning and what to tell an investor, where being wrong costs you. Rung four, the slowest and deepest, is for long-running problems you set going and come back to. A note under the ladder says every provider publishes its own names for these rungs and the names change; the ladder does not. On the right is an effort dial, a half-circle gauge with a needle and a double-headed arrow showing that it sweeps between two labelled zones: just answer on the left, think it through on the right. Keep it low for a lookup, a rename or a reformat, where you can check the answer at a glance. Turn it up for a decision you will act on, where you should ask to see the reasoning and then read it. A note says the dial changes one answer; it does not change your tier or your subscription. A strip along the foot matches three tasks from this repo to a rung and a dial position: renaming and filing what lands in the inbox is rung one on low; drafting the weekly recap from the stack is rung two on low to medium; deciding what one unit actually costs is rung three on high. The closing line reads: spend the thinking where being wrong costs you something.</desc>

  <rect x="0" y="0" width="1200" height="1288" rx="16" fill="var(--dg-bg, #EEF4F6)"/>

  <text x="48" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-text, #10222C)">Tiers and the effort dial</text>
  <text x="48" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Two separate controls. Beginners set one and miss the other.</text>

