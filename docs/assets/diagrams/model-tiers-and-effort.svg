  <text x="112" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">The hardest work</text>
  <text x="576" y="232" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">slowest, deepest</text>
  <text x="112" y="262" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Long-running problems you set going and<tspan x="112" dy="24">come back to. Rare, and worth the wait.</tspan></text>

