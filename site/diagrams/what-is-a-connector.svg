  <text x="68" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Without a standard</text>
  <text x="68" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">Custom wiring, tool by tool.</text>

  <rect x="118" y="340" width="160" height="64" rx="12" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border-strong, #75878F)" stroke-width="1.5"/>
  <text x="198" y="379" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="var(--dg-text, #10222C)">The AI</text>

  <!-- the tangle: five separate wires, each built for one tool, crossing -->
  <line x1="138" y1="404" x2="306" y2="542" stroke="var(--dg-accent, #C62C49)" stroke-width="1.5"/>
  <line x1="168" y1="404" x2="198" y2="542" stroke="var(--dg-accent, #C62C49)" stroke-width="1.5"/>
  <line x1="198" y1="404" x2="90" y2="542" stroke="var(--dg-accent, #C62C49)" stroke-width="1.5"/>
  <line x1="228" y1="404" x2="252" y2="542" stroke="var(--dg-accent, #C62C49)" stroke-width="1.5"/>
  <line x1="258" y1="404" x2="144" y2="542" stroke="var(--dg-accent, #C62C49)" stroke-width="1.5"/>

  <rect x="70" y="542" width="40" height="36" rx="8" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <rect x="124" y="542" width="40" height="36" rx="8" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <rect x="178" y="542" width="40" height="36" rx="8" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <rect x="232" y="542" width="40" height="36" rx="8" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <rect x="286" y="542" width="40" height="36" rx="8" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>

  <text x="198" y="606" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">The same five systems</text>

  <text x="68" y="654" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">Five tools, five different<tspan x="68" dy="24">ways in. Each one has to be</tspan><tspan x="68" dy="24">built and kept working.</tspan></text>

  <!-- ============ right panel: with one standard ============ -->
  <rect x="372" y="224" width="780" height="538" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>

  <text x="396" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">With one standard</text>
  <text x="396" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">One adapter shape, and every system plugs into it.</text>

  <!-- the AI -->
  <rect x="396" y="446" width="160" height="160" rx="12" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <text x="412" y="488" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">The AI</text>
  <text x="412" y="518" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">Pointed at<tspan x="412" dy="22">your folder,</tspan><tspan x="412" dy="22">and now at</tspan><tspan x="412" dy="22">these too.</tspan></text>

  <line x1="556" y1="526" x2="588" y2="526" stroke="var(--dg-border-strong, #75878F)" stroke-width="2"/>
  <path d="M 600,526 L 588,520 L 588,532 Z" fill="var(--dg-border-strong, #75878F)"/>

  <!-- the adapter: one shape, and it is the same shape every time -->
  <rect x="600" y="431" width="204" height="190" rx="12" fill="var(--dg-bg, #EEF4F6)" stroke="var(--dg-secondary, #0C7A63)" stroke-width="2"/>
  <text x="618" y="475" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">One standard</text>
  <text x="618" y="507" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">The same shape<tspan x="618" dy="22">for every system.</tspan><tspan x="618" dy="22">No custom wiring</tspan><tspan x="618" dy="22">per tool.</tspan></text>

  <!-- one origin, five lines, no crossings -->
  <line x1="804" y1="526" x2="850" y2="350" stroke="var(--dg-secondary, #0C7A63)" stroke-width="1.5"/>
  <line x1="804" y1="526" x2="850" y2="438" stroke="var(--dg-secondary, #0C7A63)" stroke-width="1.5"/>
  <line x1="804" y1="526" x2="850" y2="526" stroke="var(--dg-secondary, #0C7A63)" stroke-width="1.5"/>
  <line x1="804" y1="526" x2="850" y2="614" stroke="var(--dg-secondary, #0C7A63)" stroke-width="1.5"/>
  <line x1="804" y1="526" x2="850" y2="702" stroke="var(--dg-secondary, #0C7A63)" stroke-width="1.5"/>
  <circle cx="804" cy="526" r="6" fill="var(--dg-secondary, #0C7A63)"/>
  <circle cx="850" cy="350" r="4" fill="var(--dg-secondary, #0C7A63)"/>
  <circle cx="850" cy="438" r="4" fill="var(--dg-secondary, #0C7A63)"/>
  <circle cx="850" cy="526" r="4" fill="var(--dg-secondary, #0C7A63)"/>
  <circle cx="850" cy="614" r="4" fill="var(--dg-secondary, #0C7A63)"/>
  <circle cx="850" cy="702" r="4" fill="var(--dg-secondary, #0C7A63)"/>

