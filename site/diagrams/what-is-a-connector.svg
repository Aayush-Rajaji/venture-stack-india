  <text x="844" y="933" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="var(--dg-secondary, #0C7A63)">3</text>
  <text x="820" y="982" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">With permission</text>
  <text x="820" y="1012" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Yours, and your company's.<tspan x="820" dy="26">Personal data, and anything</tspan><tspan x="820" dy="26">under a confidentiality</tspan><tspan x="820" dy="26">obligation, stays out.</tspan></text>

  <!-- ============ foot ============ -->
  <rect x="48" y="1150" width="1104" height="88" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <text x="600" y="1186" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="var(--dg-text, #10222C)">The AI reaches exactly as far as you let it, and no further.</text>
  <text x="600" y="1212" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">A connector is an offer of access. You choose which one, and how much of it.</text>
</svg>
