  <text x="68" y="982" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Read-only first</text>
  <text x="68" y="1012" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Grant reading before you grant<tspan x="68" dy="26">writing or sending. A misfired</tspan><tspan x="68" dy="26">email is a bad first week.</tspan></text>

