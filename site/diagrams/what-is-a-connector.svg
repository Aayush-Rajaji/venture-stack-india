<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1278" width="100%" height="1278" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="connector-title connector-desc">
  <title id="connector-title">What a connector is: one standard between an AI tool and the systems a founder already runs</title>
  <desc id="connector-desc">Two panels stand side by side, showing the same five systems reached in two different ways. The narrow left panel is headed "Without a standard" and subtitled "Custom wiring, tool by tool". A box marked "The AI" sits at the top of it, and five separate lines leave the bottom of that box and run down to five small blank blocks in a row. Those lines are drawn in the warning colour and they cross one another repeatedly, because each one goes to a different block in no particular order: a tangle rather than a pattern. A note under the blocks says these are the same five systems, and the caption reads that there are five tools and five different ways in, and each one has to be built and kept working. The wide right panel is headed "With one standard" and subtitled "One adapter shape, and every system plugs into it". On the left of that panel sits a card marked "The AI", pointed at your folder and now at these systems too. A single arrow runs from it into a tall block in the middle marked "One standard", which explains that it is the same shape for every system, with no custom wiring per tool. That block is the Model Context Protocol, described without leaning on the acronym. From one point on the right edge of the block, five clean lines fan out, none of them crossing, to five labelled cards. Each card carries a small drawn mark and one line saying what it holds. Mail holds threads and replies. A document drive holds decks and contracts. A calendar holds who you met and when. A task tracker holds open items and owners. A repository holds your files and their history. None of the five carries a company name or a logo, because the shape is the same whichever product you happen to use. Below the two panels, a strip of three numbered cards sets out the habits that keep this safe, because this is where the risk sits. One, read-only first: grant reading before you grant writing or sending, since a misfired email is a bad first week. Two, scoped: connect the one mailbox or folder the task needs, not the whole account. Three, with permission: yours and your company's, with personal data and anything under a confidentiality obligation staying out. The closing line says that the AI reaches exactly as far as you let it and no further, and that a connector is an offer of access in which you choose which one, and how much of it.</desc>

  <rect x="0" y="0" width="1200" height="1278" rx="16" fill="var(--dg-bg, #EEF4F6)"/>

  <text x="48" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-text, #10222C)">What a connector is</text>
  <text x="48" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">The Model Context Protocol, in plain terms: one standard for plugging your own systems into an AI tool.</text>
  <text x="48" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">In practice it is something you switch on, authorise once, then refer to in plain English.</text>

  <text x="48" y="164" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Two ways in</text>
  <text x="48" y="188" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-muted, #3F5560)">The same five systems, wired by hand or reached through one adapter.</text>
  <line x1="48" y1="204" x2="1152" y2="204" stroke="var(--dg-border-strong, #75878F)" stroke-width="1.5"/>

  <!-- ============ left panel: without a standard ============ -->
