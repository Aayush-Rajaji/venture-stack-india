<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="640" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="stay-title stay-desc">
  <title id="stay-title">Three rules that keep a person accountable for AI-drafted work</title>
  <desc id="stay-desc">Three numbered panels sit above a strip that reads "the AI drafts, a person decides". Panel one, read it end to end: read the whole draft before it goes anywhere, not the summary of it and not just the top; if you would not say it out loud, it does not go out. Panel two, one named person owns it: put a name against every file and every number, because a file with no owner is nobody's job, and the front matter has an owner field for exactly this. Panel three, open the sources yourself: every figure cites a file and a page, so pick two at random, open them, and check the numbers — a citation nobody opens is just a citation.</desc>

  <rect x="0" y="0" width="1200" height="640" rx="16" fill="var(--dg-bg, #EEF4F6)"/>

  <text x="48" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-text, #10222C)">Stay in the loop</text>
  <text x="48" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Three things stay yours, whatever the AI drafted.</text>

  <!-- panel 1 -->
  <rect x="48" y="150" width="344" height="316" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="96" cy="198" r="22" fill="none" stroke="var(--dg-primary, #0B5A86)" stroke-width="1.5"/>
  <text x="96" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="var(--dg-primary, #0B5A86)">1</text>
  <text x="72" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Read it end to end</text>
  <line x1="72" y1="280" x2="368" y2="280" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <text x="72" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Read the whole draft before it<tspan x="72" dy="24">goes anywhere. Not the summary</tspan><tspan x="72" dy="24">of it, and not just the top.</tspan></text>
  <rect x="64" y="380" width="312" height="68" rx="8" fill="var(--dg-bg, #EEF4F6)"/>
  <text x="80" y="408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-accent, #C62C49)">If you would not say it out loud,<tspan x="80" dy="22">it does not go out.</tspan></text>

  <!-- panel 2 -->
  <rect x="428" y="150" width="344" height="316" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="476" cy="198" r="22" fill="none" stroke="var(--dg-primary, #0B5A86)" stroke-width="1.5"/>
  <text x="476" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="var(--dg-primary, #0B5A86)">2</text>
  <text x="452" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">One named person owns it</text>
  <line x1="452" y1="280" x2="748" y2="280" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <text x="452" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Put a name against every file<tspan x="452" dy="24">and every number. A file with</tspan><tspan x="452" dy="24">no owner is nobody's job.</tspan></text>
  <rect x="444" y="380" width="312" height="68" rx="8" fill="var(--dg-bg, #EEF4F6)"/>
  <text x="460" y="408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-accent, #C62C49)">The front matter has an owner<tspan x="460" dy="22">field. Use it.</tspan></text>

  <!-- panel 3 -->
  <rect x="808" y="150" width="344" height="316" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <circle cx="856" cy="198" r="22" fill="none" stroke="var(--dg-primary, #0B5A86)" stroke-width="1.5"/>
  <text x="856" y="206" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="var(--dg-primary, #0B5A86)">3</text>
  <text x="832" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="var(--dg-text, #10222C)">Open the sources yourself</text>
  <line x1="832" y1="280" x2="1128" y2="280" stroke="var(--dg-border, #C1D1D8)" stroke-width="1.5"/>
  <text x="832" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="var(--dg-muted, #3F5560)">Every figure cites a file and a<tspan x="832" dy="24">page. Pick two at random, open</tspan><tspan x="832" dy="24">them, and check the numbers.</tspan></text>
  <rect x="824" y="380" width="312" height="68" rx="8" fill="var(--dg-bg, #EEF4F6)"/>
  <text x="840" y="408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="var(--dg-accent, #C62C49)">A citation nobody opens is just<tspan x="840" dy="22">a citation.</tspan></text>

  <!-- footer strip -->
  <rect x="48" y="500" width="1104" height="92" rx="12" fill="var(--dg-surface, #FFFFFF)" stroke="var(--dg-primary, #0B5A86)" stroke-width="2"/>
  <text x="600" y="558" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="var(--dg-primary, #0B5A86)">The AI drafts. A person decides.</text>
</svg>
